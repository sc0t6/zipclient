[package]
name = "zip-launcher"
version = "2.3.0"
description = "Zip Minecraft Launcher"
authors = ["Krizuvo"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.80"

[lib]
name = "zip_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "sync", "time", "net"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
ring = "0.17"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "6"
flate2 = "1"
tar = "0.4"
hickory-resolver = { version = "0.25.2", default-features = false, features = ["tokio", "system-config"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
